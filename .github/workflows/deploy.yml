name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: AIzaSyAfXli-VenoDHGtsFdXH3yYfIBJITYnwSI
          VITE_FIREBASE_AUTH_DOMAIN: media-journal-c6d2e.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: media-journal-c6d2e
          VITE_FIREBASE_STORAGE_BUCKET: media-journal-c6d2e.firebasestorage.app
          VITE_FIREBASE_MESSAGING_SENDER_ID: '707853840860'
          VITE_FIREBASE_APP_ID: '1:707853840860:web:590678b367b27d9b25df19'
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
