<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#1976D2" />
    <meta
      name="description"
      content="Media Journal — a permanent, offline-first archive of everything you read, watch and listen to."
    />
    <title>Media Journal</title>
    <!--
      Companion to public/404.html (spa-github-pages redirect trick).
      Runs before React mounts: if the URL contains the encoded path
      injected by 404.html (signalled by the query string starting with
      '/?/'), it decodes it and calls history.replaceState so React
      Router sees the original clean URL with no visible redirect flash.
    -->
    <script>
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) {
              return s.replace(/~and~/g, '&');
            })
            .join('?');
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
        }
      })(window.location);
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
